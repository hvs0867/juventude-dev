<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
</head>
<body>
    <form action="#" method="post" id="formulario">
        <h1>Criar Perfil</h1>

        <label for="campo-nome">Nome Completo</label>
        <input type="text" name="nome" id="campo-nome" placeholder="Seu Nome Completo">
        <br>

        <label for="campo-nome-de-usuario">Nome de Usuario</label>
        <input type="text" id="campo-nome-de-usuario" placeholder="Seu nome de Usuario" name="Nome-Usuario">
        <br>

        <label for="campo-email">Seu email</label>
        <input type="email" id="campo-email" placeholder="Seu email" name="email">
        <br>

        <label for="campo-senha">Sua senha</label>
        <input type="password" id="campo-senha" placeholder="Sua senha" name="senha">
        <br>
        
        <label for="campo-confirmar-senha">Confirme a sua senha</label>
        <input type="password" id="campo-confirmar-senha" placeholder="Sua novamente senha" name="confirmar-senha">
        <br>
 
        <button type="submit">Criar perfil</button>
    </form>


</body>
</html>
