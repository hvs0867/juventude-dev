<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de login</title>
</head>
<body>
    <form id="formulario" method="post" action="#">

        <h1>Entrar na conta</h1>

        <label for="campo-email">Seu email</label>
        <input type="email" placeholder="Seu email" id="campo-email">
        <br>

        <label for="campo-senha">Sua senha</label>
        <input type="password" id="campo-senha" placeholder="Sua senha">

        <button type="submit">Entrar</button>
        
    </form>
</body>
</html>
