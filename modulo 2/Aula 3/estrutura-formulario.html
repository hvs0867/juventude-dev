<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>

<html>

<form action="#" method="postar">
    <h1 align="center">Seu Formulario</h1>
    
    <hr>
    <input type="text" name="nome"  placeholder="Seu nome:">
    <br><br>

    <input type="email" name="email"  placeholder="Seu email:">
    <br><br>

    <input type="password" name="senha" placeholder="Sua senha">
    <br><br>

    <input type="number" name="idade" placeholder="Sua idade">

    <input type="date" name="nascimento">

    <br><br>
    
    <input type="checkbox" name="Aceite" value="Sim"> Aceite os termos de uso do site
    <br><br>
    <!--|Essa parte 'checkbox' deixa o botao quadrado-->

    <input type="radio" name="Genero" value="F"> Feminino 
    <!--essa parte chamada 'radio' deixa o botao redondo -->

    <input type="radio" name="Genero" value="M"> Masculino

    <br><br>
    <input type="file" name="Foto-de-perfil"> 
    <br><br>

    <select name="Assunto">
        <option value="Duvida"> Duvida </option>
        <option value="elogio"> Elogio </option>
        <option value="Reclamação"> Reclamação </option>
    </select>
    <br><br>
    <textarea name="Mensagem" rows="2" placeholder="Escreva a sua mensagem"></textarea>

    <button type="submit"> Eviar </button>

</form>

</html>
