<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 01</title>
</head>
<body>
    <form action="#" id="formulario" method="post">

        
        <h1 align="center">Cadastro de Usuário</h1>
        
        <label for="campo-nome">Nome Completo</label>
        <input type="text" id="campo-nome" placeholder="Seu Nome">
        
        <br>
        <label for="campo-email">Email</label>
        <input type="email" id="campo-email" placeholder="Seu email">
        
        <br>
        <label for="campo-senha">Sua senha</label>
        <input type="password" id="campo-senha" placeholder="Digite sua Senha">
        
        <br>
        <label for="campo-confirmar-senha">Cofirme sua senha</label>
        <input type="password" id="campo-confirmar-senha" placeholder="Sua senha">
        
        <br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
