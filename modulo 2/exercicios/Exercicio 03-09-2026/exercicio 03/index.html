<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Tecnico"</title>
</head>
<body>
    <form id="formulario" method="post" action="#">
        <h1>Fale Conosco</h1>

        <label for="campo-nome">Seu Nome</label>
        <input type="text" id="campo-nome" placeholder="Seu Nome">
        <br>

        <label for="campo-email">Seu email</label>
        <input type="email" placeholder="Seu email" id="campo-email">
        <br>

        <label for="campo-texto">Assunto</label>
        <textarea name="mensagem" id="campo-texto" placeholder="Mensagem" rows="4"></textarea>

        <button type="submit">Enviar menssagem</button>
    </form>
    
</body>
</html>
